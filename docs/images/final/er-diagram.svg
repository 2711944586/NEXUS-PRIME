    <rect class="box-head" width="170" height="42"/>
    <text class="box-title" x="16" y="27">biz_tags</text>
    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field" x="16" y="82">name, color</text>
    <text class="field fk" x="16" y="102">via product_tags</text>
  </g>

