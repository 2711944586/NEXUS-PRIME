    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field fk" x="16" y="82">FK order_id</text>
    <text class="field fk" x="16" y="102">FK product_id</text>
    <text class="field" x="16" y="122">qty, unit_price</text>
  </g>
  <g class="entity" transform="translate(56 586)">
    <rect class="box" width="206" height="136"/>
    <rect class="box-head" width="206" height="42"/>
    <text class="box-title" x="16" y="27">purchase_orders</text>
    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field fk" x="16" y="82">FK supplier_id</text>
    <text class="field" x="16" y="102">approval_status</text>
    <text class="field" x="16" y="122">receive_status</text>
