<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS Prime ER Diagram</title>
  <desc id="desc">Core database relationships for auth, products, inventory, sales, purchase, finance, content, reports, AI sessions and audit logs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfb"/>
      <stop offset="1" stop-color="#edf5f2"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .title { font: 800 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 14px Arial, sans-serif; fill: #64748b; }
      .entity { filter: url(#shadow); }
      .box { fill: #fff; stroke: #dbe5e8; stroke-width: 1.2; rx: 16; }
      .box-head { fill: url(#head); rx: 16; }
      .box-title { font: 800 16px Arial, sans-serif; fill: #fff; }
      .field { font: 600 12px Arial, sans-serif; fill: #334155; }
      .pk { fill: #0f766e; font-weight: 800; }
      .fk { fill: #2563eb; font-weight: 800; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .label { font: 700 11px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="820"/>
  <text class="title" x="56" y="58">NEXUS Prime Core ER Diagram</text>
  <text class="subtitle" x="56" y="84">Manufacturing operations data model: identity, master data, inventory, purchase, sales, finance, content, reports, AI and audit.</text>

  <g class="entity" transform="translate(56 126)">
    <rect class="box" width="190" height="136"/>
    <rect class="box-head" width="190" height="42"/>
    <text class="box-title" x="16" y="27">auth_users</text>
    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field" x="16" y="82">email, username</text>
    <text class="field fk" x="16" y="102">FK role_id</text>
    <text class="field fk" x="16" y="122">FK department_id</text>
  </g>
  <g class="entity" transform="translate(300 126)">
    <rect class="box" width="170" height="102"/>
    <rect class="box-head" width="170" height="42"/>
    <text class="box-title" x="16" y="27">auth_roles</text>
    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field" x="16" y="82">name, permissions</text>
  </g>
  <g class="entity" transform="translate(300 252)">
    <rect class="box" width="170" height="102"/>
    <rect class="box-head" width="170" height="42"/>
    <text class="box-title" x="16" y="27">departments</text>
    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field" x="16" y="82">name, code</text>
  </g>

  <g class="entity" transform="translate(536 112)">
