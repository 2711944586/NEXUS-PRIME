    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field fk" x="16" y="82">FK product / warehouse</text>
    <text class="field" x="16" y="102">delta, source</text>
  </g>

  <g class="entity" transform="translate(56 396)">
