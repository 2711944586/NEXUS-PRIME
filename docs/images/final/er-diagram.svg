    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field fk" x="16" y="82">FK product_id</text>
    <text class="field fk" x="16" y="102">FK warehouse_id</text>
    <text class="field" x="16" y="122">quantity, location</text>
  </g>
  <g class="entity" transform="translate(796 412)">
