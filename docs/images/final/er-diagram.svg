    <rect class="box-head" width="206" height="42"/>
    <text class="box-title" x="16" y="27">biz_products</text>
    <text class="field pk" x="16" y="62">PK id</text>
    <text class="field" x="16" y="82">sku, name, price</text>
    <text class="field fk" x="16" y="102">FK category_id</text>
    <text class="field fk" x="16" y="122">FK supplier_id</text>
    <text class="field" x="16" y="142">min_stock, is_active</text>
  </g>
  <g class="entity" transform="translate(796 112)">
