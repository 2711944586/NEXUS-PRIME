  </g>
  <g class="entity" transform="translate(1038 738)">
    <rect class="box" width="184" height="62"/>
    <rect class="box-head" width="184" height="34"/>
    <text class="box-title" x="14" y="23">sys_audit_logs</text>
    <text class="field fk" x="14" y="52">user, action, object</text>
  </g>

  <path class="line" d="M246 164 H300"/>
  <text class="label" x="258" y="154">role</text>
  <path class="line" d="M246 222 C270 222 270 304 300 304"/>
  <text class="label" x="256" y="286">department</text>
