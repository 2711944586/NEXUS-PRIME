name: nexus-prime-mainland

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_prime}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_prime}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    env_file:
      - path: .env.mainland
        required: false
    environment:
      FLASK_APP: run.py
      FLASK_CONFIG: production
      PORT: 5000
      NEXUS_RUNTIME_DIR: /app/backend/.runtime
      UPLOAD_FOLDER: /app/backend/storage/uploads
      UPLOAD_FILES_FOLDER: /app/backend/storage/uploads/files
      UPLOAD_AVATARS_FOLDER: /app/backend/storage/uploads/avatars
      UPLOAD_LIBRARY_FOLDER: /app/backend/storage/uploads/library
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend-runtime:/app/backend/.runtime
      - backend-uploads:/app/backend/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    command: ["celery", "-A", "app.platform.jobs.celery_app", "worker", "-l", "info", "-Q", "events,reports,ai,celery"]
    env_file:
      - path: .env.mainland
        required: false
    environment:
      FLASK_APP: run.py
      FLASK_CONFIG: production
      NEXUS_RUNTIME_DIR: /app/backend/.runtime
    volumes:
      - backend-runtime:/app/backend/.runtime
      - backend-uploads:/app/backend/storage/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    command: ["celery", "-A", "app.platform.jobs.celery_app", "beat", "-l", "info", "--schedule", "/app/backend/.runtime/celerybeat-schedule"]
    env_file:
      - path: .env.mainland
        required: false
    environment:
      FLASK_APP: run.py
      FLASK_CONFIG: production
      NEXUS_RUNTIME_DIR: /app/backend/.runtime
    volumes:
      - backend-runtime:/app/backend/.runtime
      - backend-uploads:/app/backend/storage/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        NEXUS_API_BASE_URL: ${NEXUS_API_BASE_URL:?set NEXUS_API_BASE_URL}
        NEXUS_SENTRY_DSN: ${NEXUS_SENTRY_DSN:-}
        NEXUS_SENTRY_ENVIRONMENT: ${NEXUS_SENTRY_ENVIRONMENT:-production}
        NEXUS_SENTRY_RELEASE: ${NEXUS_SENTRY_RELEASE:-}
        NEXUS_SENTRY_TRACES_SAMPLE_RATE: ${NEXUS_SENTRY_TRACES_SAMPLE_RATE:-0}
    environment:
      NEXUS_API_BASE_URL: ${NEXUS_API_BASE_URL:?set NEXUS_API_BASE_URL}
      NEXUS_SENTRY_DSN: ${NEXUS_SENTRY_DSN:-}
      NEXUS_SENTRY_ENVIRONMENT: ${NEXUS_SENTRY_ENVIRONMENT:-production}
      NEXUS_SENTRY_RELEASE: ${NEXUS_SENTRY_RELEASE:-}
      NEXUS_SENTRY_TRACES_SAMPLE_RATE: ${NEXUS_SENTRY_TRACES_SAMPLE_RATE:-0}
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  backend-runtime:
  backend-uploads:
