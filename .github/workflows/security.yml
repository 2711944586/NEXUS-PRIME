name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-secret-scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python audit tooling
        run: python -m pip install pip-audit

      - name: Prepare report directory
        run: mkdir -p output

      - name: Run Python dependency audit
        run: python -m pip_audit -r backend/requirements.txt --format json --output output/pip-audit.json

      - name: Run frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high --json > ../output/npm-audit.json

      - name: Run dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Run secret scan
        uses: trufflesecurity/trufflehog@v3.90.6
        with:
          path: .
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            output/pip-audit.json
            output/npm-audit.json
          if-no-files-found: ignore
          retention-days: 14
