name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        env:
          FLASK_APP: run.py
          FLASK_CONFIG: testing
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --watch=false
      - name: Build production SPA
        env:
          NEXUS_API_BASE_URL: https://nexus-prime-api.example.com/api/v1
        run: npm run build

  delivery-hygiene:
    name: Delivery hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python audit dependencies
        run: pip install Pillow python-docx
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run API contract audit
        run: python scripts/audit-api-contracts.py --json-output output/api-contract-audit-ci.json
      - name: Run chart audit
        working-directory: frontend
        run: npm run audit:charts
      - name: Run delivery asset audit
        run: python scripts/audit-delivery-assets.py --no-regenerate-docx --json-output output/delivery-audit-ci.json
      - name: Run deployment preflight
        shell: pwsh
        env:
          NEXUS_API_BASE_URL: https://nexus-prime-api.example.com/api/v1
          FRONTEND_ORIGIN: https://nexus-prime-web.example.com
          CORS_ORIGINS: https://nexus-prime-web.example.com
          DATABASE_URL: postgresql://postgres.project-ref:password@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
          AUTH_COOKIE_SECURE: "true"
          AUTH_COOKIE_SAMESITE: None
          SECRET_KEY: local-preflight-secret-key-32-characters
          CLOUDINARY_URL: cloudinary://api_key:api_secret@cloud_name
          CACHE_TYPE: RedisCache
          REDIS_URL: redis://cache.example.com:6379/0
          CACHE_REDIS_URL: redis://cache.example.com:6379/0
        run: ./scripts/preflight.ps1 -SkipApiProbe -SkipBuild -SkipBackendTests -NoInstall -AllowMissingDependencies
