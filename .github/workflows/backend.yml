name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Backend pytest and OpenAPI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_prime_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_prime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_APP: run.py
      FLASK_CONFIG: testing
      DATABASE_URL: postgresql+psycopg2://nexus:nexus@localhost:5432/nexus_prime_test
      REDIS_URL: redis://localhost:6379/0
      CACHE_REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate migrations
        env:
          FLASK_CONFIG: development
        run: python -m flask db upgrade
      - name: Run pytest
        run: python -m pytest -q --junitxml ../output/backend-pytest.xml
      - name: Check OpenAPI generated artifacts sync
        working-directory: .
        run: python scripts/check-openapi-sync.py --json-output output/openapi-sync-backend-ci.json
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-reports
          path: |
            output/backend-pytest.xml
            output/openapi-sync-backend-ci.json
          if-no-files-found: ignore
          retention-days: 14
