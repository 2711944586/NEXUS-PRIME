name: Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies for OpenAPI export
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --watch=false
      - name: Build production SPA
        env:
          NEXUS_API_BASE_URL: https://nexus-prime-api.example.com/api/v1
        run: npm run build
      - name: Check OpenAPI generated artifacts sync
        run: npm run api:check
      - name: Run chart audit
        run: npm run audit:charts
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-reports
          path: |
            output/**/*.json
          if-no-files-found: ignore
          retention-days: 14
