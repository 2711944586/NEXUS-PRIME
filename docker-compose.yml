services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_prime}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_prime}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      FLASK_APP: run.py
      FLASK_CONFIG: development
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexus:nexus@postgres:5432/nexus_prime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      NEXUS_RUNTIME_DIR: /app/backend/.runtime
      UPLOAD_FOLDER: /app/backend/storage/uploads
      UPLOAD_FILES_FOLDER: /app/backend/storage/uploads/files
      UPLOAD_AVATARS_FOLDER: /app/backend/storage/uploads/avatars
      UPLOAD_LIBRARY_FOLDER: /app/backend/storage/uploads/library
      AI_LOCAL_ANALYSIS: ${AI_LOCAL_ANALYSIS:-true}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend-runtime:/app/backend/.runtime
      - backend-uploads:/app/backend/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["celery", "-A", "app.platform.jobs.celery_app", "worker", "-l", "info", "-Q", "events,reports,ai,celery"]
    environment:
      FLASK_APP: run.py
      FLASK_CONFIG: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexus:nexus@postgres:5432/nexus_prime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      NEXUS_RUNTIME_DIR: /app/backend/.runtime
      AI_LOCAL_ANALYSIS: ${AI_LOCAL_ANALYSIS:-true}
    volumes:
      - backend-runtime:/app/backend/.runtime
      - backend-uploads:/app/backend/storage/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["celery", "-A", "app.platform.jobs.celery_app", "beat", "-l", "info", "--schedule", "/app/backend/.runtime/celerybeat-schedule"]
    environment:
      FLASK_APP: run.py
      FLASK_CONFIG: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://nexus:nexus@postgres:5432/nexus_prime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      NEXUS_RUNTIME_DIR: /app/backend/.runtime
      AI_LOCAL_ANALYSIS: ${AI_LOCAL_ANALYSIS:-true}
    volumes:
      - backend-runtime:/app/backend/.runtime
      - backend-uploads:/app/backend/storage/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NEXUS_API_BASE_URL: ${NEXUS_API_BASE_URL:-http://127.0.0.1:5000/api/v1}
      NEXUS_LOCAL_API_BASE_URL: ${NEXUS_API_BASE_URL:-http://127.0.0.1:5000/api/v1}
      NEXUS_RUNTIME_CONFIG_LOCAL: "1"
      NEXUS_SENTRY_DSN: ${NEXUS_SENTRY_DSN:-}
      NEXUS_SENTRY_ENVIRONMENT: ${NEXUS_SENTRY_ENVIRONMENT:-local}
      NEXUS_SENTRY_RELEASE: ${NEXUS_SENTRY_RELEASE:-}
      NEXUS_SENTRY_TRACES_SAMPLE_RATE: ${NEXUS_SENTRY_TRACES_SAMPLE_RATE:-0}
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  backend-runtime:
  backend-uploads:
